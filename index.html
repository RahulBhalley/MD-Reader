<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>MD-Reader</title>
  </head>
  <body>
    <div id="app">
      <nav id="sidebar">
        <div class="sidebar-header">
          <h3>MD-Reader</h3>
          <button id="import-btn">Import MD Files</button>
        </div>
        <ul id="file-list">
          <!-- Imported files will appear here -->
        </ul>
        <div class="sidebar-footer">
          <span id="version-info">v0.0.0</span>
        </div>
      </nav>
      <main id="viewer">
        <div id="content-area-wrapper">
          <div id="content-area">
            <p class="placeholder">Select a file from the sidebar to start reading.</p>
          </div>
        </div>
        <div id="chat-container">
          <div id="chat-messages"></div>
          <div id="chat-input-bar">
            <input type="text" id="chat-input" placeholder="Ask a question about this document..." />
            <button id="chat-send-btn">Send</button>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
