<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>MD-Reader</title>
  </head>

    <div id="app">
      <nav id="sidebar">
        <div class="sidebar-header">
          <h3>MD-Reader</h3>
          <button id="import-btn">Import MD Files</button>
        </div>

    </div>
    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
